[project]
name = "backend"
version = "1.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jose A Lopez Jr", email = "flopez0294@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.3",
    "asyncpg>=0.32.0",
    "boto3>=1.43.51",
    "fastapi>=0.139.2",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "gunicorn>=27.0.1",
    "python-dotenv>=1.2.2",
    "resend>=2.45.0",
    "ruff>=0.15.22",
    "uvicorn-worker>=0.4.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "schemathesis>=4.27.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.semantic_release]
version_toml = ["backend/pyproject.toml:project.version"]
branch = "main"
tag_format = "v{version}"
commit_message = "chore(release): {version} [skip ci]"